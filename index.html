<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>wesstyle.arg — portfolio</title>
  <link rel="icon" type="image/ico" href="img/iconos/logo.ico" />
  <link rel="stylesheet" href="style.css" />
  <link href="fonts/circular.woff2" rel="stylesheet" />
  <meta property="og:description" content="Priorizamos la estética." />
  <meta property="og:image" content="img/iconos/logo.ico" />
  <meta property="og:url" content="https://wesstyle.site/" />
  <meta property="og:type" content="website" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="img/iconos/logo-texto.svg" alt="Logo" class="logo">
    </div>
    <nav class="top-nav">
      <button id="btn-disenos" class="nav-btn active">Diseños</button>
      <a href="precios.html" class="nav-btn outline">Precios</a>
      <a href="contacto.html" class="nav-btn outline">Contacto</a>
      <a href="chicagoe.html" class="nav-btn outline">Chicagoe Font</a>
    </nav>
  </header>

  <div class="app">
    <aside class="sidebar">
      <ul>
        <li><button class="side-item" data-section="menu"><img src="img/playlist/megusta.png" alt=""/></button></li>
        <li><button class="side-item" data-section="portadas"><img src="img/playlist/portadas.png" alt="Portadas"/></button></li>
        <li><button class="side-item" data-section="flyers"><img src="img/playlist/flyers.png" alt="Flyers/Poster"/></button></li>
        <li><button class="side-item" data-section="logos"><img src="img/playlist/logos.png" alt="Logos"/></button></li>
        <li><button class="side-item" data-section="videos"><img src="img/playlist/videos.png" alt="Videos"/></button></li>
      </ul>
    </aside>

    <main class="content">
      <section class="left-panel">
        <div class="section-header">
          <h3>Portfolio</h3>
          <h1 id="section-name">wesstyle.arg</h1>
        </div>
        <div id="grid" class="grid"></div>
        <div id="load-more-container" style="display: flex; justify-content: center; margin-bottom: 50px;">
    <button id="btn-load-more" class="nav-btn outline" style="display: none; cursor: pointer; padding: 10px 30px;">
        Ver más
    </button>
</div>
      </section>

      <aside class="right-panel">
        <div class="preview">
          <div class="preview-image">
            <img id="preview-image" src="img/portadas/01.jpg" alt="preview" />
          </div>
        </div>
      </aside>
    </main>
  </div>

  <footer class="player">
    <div class="track-cover">
      <img src="" alt="Portada de la pista actual" id="player-cover">
    </div>
    <div class="track-info">
      <h2 id="preview-title">Título portada ejemplo</h2>
      <p id="preview-client">Cliente portada ejemplo</p>
    </div>

    <div class="player-controls">
      <button id="prev">
        <img src="img/iconos/player_left.svg" alt="Anterior" />
      </button>
      <button id="play" class="main-player-btn">
        <img src="img/iconos/player_button.svg" alt="Reproducir/Pausar" />
      </button>
      <button id="next">
        <img src="img/iconos/player_right.svg" alt="Siguiente" />
      </button>
    </div>

    <div class="track-placeholder"></div>
  </footer>

  <div id="lightbox" class="lightbox">
    <button class="lightbox-close">✕</button>
    <button id="lightbox-back" class="lightbox-back" style="display:none;">← Volver</button>
    <div id="video-container" style="display:none; width:90%; max-width:800px; aspect-ratio:16/9; position:relative;"></div>
    <img id="lightbox-image" src="" alt="Imagen completa" />
  </div>

  <script src="script.js"></script>

  <!-- CHICAGOE FLOATING RELEASE -->
<a href="chicagoe.html" class="font-popup">
  
  <div class="font-popup-image">
    <img src="img/chicagoe/chicagoe.png" alt="Chicagoe Font">
  </div>

  <div class="font-popup-content">
    <span class="font-popup-badge">NUEVO</span>

    <h3>Chicagoe Font</h3>

    <p>
      Una tipografía gótica inspirada en Chicago y en el underground.
    </p>
  </div>

</a>
</body>
</html>
