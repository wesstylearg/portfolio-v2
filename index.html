<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wesstyle.arg — portfolio</title>
  <link rel="icon" type="image/ico" href="img/iconos/logo.ico" />
  <link rel="stylesheet" href="style.css" />
  <link href="fonts/circular.woff2" rel="stylesheet" />
  
  <meta property="og:description" content="Priorizamos la estética — Portfolio 2026." />
  <meta property="og:image" content="img/iconos/logo.ico" />
  <meta property="og:url" content="https://wesstyle.site/" />
  <meta property="og:type" content="website" />

  <style>
    /* Fix local para el contenedor de la App */
    .app {
      height: calc(100vh - 60px - 80px); /* Resta Header y Player */
      overflow: hidden;
    }
  </style>
</head>
<body class="app-index">

  <header class="topbar">
    <div class="brand">
      <img src="img/iconos/logo-texto.svg" alt="Logo" class="logo">
    </div>
    <nav class="top-nav">
      <button id="btn-disenos" class="nav-btn active">Diseños</button>
      <a href="precios.html" class="nav-btn outline">Precios</a>
      <a href="contacto.html" class="nav-btn outline">Contacto</a>
    </nav>
  </header>

  <div class="app">
    <aside class="sidebar">
      <ul>
        <li><button class="side-item active" data-section="menu"><img src="img/playlist/megusta.png" alt="Todo"/></button></li>
        <li><button class="side-item" data-section="portadas"><img src="img/playlist/portadas.png" alt="Portadas"/></button></li>
        <li><button class="side-item" data-section="flyers"><img src="img/playlist/flyers.png" alt="Flyers"/></button></li>
        <li><button class="side-item" data-section="logos"><img src="img/playlist/logos.png" alt="Logos"/></button></li>
        <li><button class="side-item" data-section="videos"><img src="img/playlist/videos.png" alt="Videos"/></button></li>
      </ul>
    </aside>

    <main class="content">
      <section class="left-panel">
        <div class="section-header">
          <h3>Portfolio</h3>
          <h1 id="section-name">WESSTYLE.ARG</h1>
        </div>
        <div id="grid" class="grid">
            </div>
      </section>

      <aside class="right-panel">
        <div class="preview">
          <div class="preview-image" id="preview-container">
            <img id="preview-image" src="img/portadas/01.jpg" alt="preview" />
            <video id="preview-video" loop muted playsinline style="display: none; width: 100%; border-radius: 8px;"></video>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <footer class="player">
    <div class="track-cover">
      <img src="img/portadas/01.jpg" alt="Cover" id="player-cover">
    </div>
    
    <div class="track-info">
      <h2 id="preview-title">Selecciona un diseño</h2>
      <p id="preview-client">Wesstyle Studio — 2026</p>
    </div>

    <div class="player-controls">
      <button id="prev">
        <img src="img/iconos/player_left.svg" alt="Anterior" />
      </button>
      <button id="play" class="main-player-btn">
        <img src="img/iconos/player_button.svg" alt="Play" />
      </button>
      <button id="next">
        <img src="img/iconos/player_right.svg" alt="Siguiente" />
      </button>
    </div>

    <div class="track-placeholder" style="flex: 1; max-width: 200px;"></div>
  </footer>

  <div id="lightbox" class="lightbox">
    <button class="lightbox-close">✕</button>
    <img id="lightbox-image" src="" alt="Zoom" />
  </div>

  <script src="script.js"></script>
</body>
</html>
