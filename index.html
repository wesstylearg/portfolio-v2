<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wesstyle.arg — portfolio</title>
  <link rel="icon" type="image/ico" href="img/iconos/logo.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="img/iconos/logo-texto.svg" alt="Logo" class="logo">
    </div>
    <nav class="top-nav">
      <button id="btn-disenos" class="nav-btn active">Diseños</button>
      <a href="precios.html" class="nav-btn outline">Precios</a>
      <a href="contacto.html" class="nav-btn outline">Contacto</a>
    </nav>
  </header>

  <div class="app">
    <aside class="sidebar">
      <ul>
        <li><button class="side-item active" data-section="menu" title="Home"><img src="img/playlist/megusta.png" alt=""></button></li>
        <li><button class="side-item" data-section="portadas" title="Portadas"><img src="img/playlist/portadas.png" alt=""></button></li>
        <li><button class="side-item" data-section="flyers" title="Flyers"><img src="img/playlist/flyers.png" alt=""></button></li>
        <li><button class="side-item" data-section="logos" title="Logos"><img src="img/playlist/logos.png" alt=""></button></li>
        <li><button class="side-item" data-section="videos" title="Videos"><img src="img/playlist/videos.png" alt=""></button></li>
      </ul>
    </aside>

    <main class="content">
      <section class="left-panel">
        <div class="section-header">
          <h3>Portfolio</h3>
          <h1 id="section-name">WESSTYLE.ARG</h1>
        </div>
        <div id="grid" class="grid">
          </div>
      </section>

      <aside class="right-panel">
        <div class="preview-container" id="preview-container">
          <img id="preview-image" src="img/portadas/soulside.png" alt="Preview">
          <div id="video-wrapper"></div>
        </div>
      </aside>
    </main>
  </div>

  <footer class="player">
    <div class="track-cover">
      <img id="player-cover" src="img/portadas/soulside.png" alt="Cover">
    </div>
    
    <div class="track-info">
      <h2 id="preview-title">Selecciona un diseño</h2>
      <p id="preview-client">wesstyle.arg — 2026</p>
    </div>

    <div class="player-controls">
      <button id="prev"><img src="img/iconos/player_left.svg" alt="Ant"></button>
      <button id="play" class="main-player-btn"><img src="img/iconos/player_button.svg" alt="Play"></button>
      <button id="next"><img src="img/iconos/player_right.svg" alt="Sig"></button>
    </div>
    <div class="track-placeholder"></div>
  </footer>

  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-image" src="" alt="">
  </div>

  <script src="script.js"></script>
</body>
</html>
