<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wesstyle.arg — portfolio</title>
  <link rel="icon" type="image/ico" href="img/iconos/logo.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="img/iconos/logo-texto.svg" alt="Logo" class="logo">
    </div>
    <nav class="top-nav">
      <button class="nav-btn active">Diseños</button>
      <a href="precios.html" class="nav-btn outline">Precios</a>
      <a href="contacto.html" class="nav-btn outline">Contacto</a>
    </nav>
  </header>

  <div class="app">
    <aside class="sidebar">
      <ul>
        <li><button class="side-item active" data-section="menu"><img src="img/playlist/megusta.png" alt="Todo"/></button></li>
        <li><button class="side-item" data-section="portadas"><img src="img/playlist/portadas.png" alt="Portadas"/></button></li>
        <li><button class="side-item" data-section="flyers"><img src="img/playlist/flyers.png" alt="Flyers"/></button></li>
        <li><button class="side-item" data-section="logos"><img src="img/playlist/logos.png" alt="Logos"/></button></li>
        <li><button class="side-item" data-section="videos"><img src="img/playlist/videos.png" alt="Videos"/></button></li>
      </ul>
    </aside>

    <main class="content">
      <section class="left-panel">
        <div class="section-header">
          <h1 id="section-name">PORTFOLIO</h1>
        </div>
        <div id="grid" class="grid">
          </div>
      </section>

      <aside class="right-panel">
        <div class="preview-container">
          <img id="preview-image" src="img/portadas/01.jpg" alt="Preview">
          <video id="preview-video" muted loop playsinline style="display:none;"></video>
        </div>
      </aside>
    </main>
  </div>

  <footer class="player">
    <div class="track-cover">
      <img src="img/portadas/01.jpg" id="player-cover" alt="Cover">
    </div>
    <div class="track-info">
      <h2 id="preview-title">Selecciona un diseño</h2>
      <p id="preview-client">wesstyle.arg — 2026</p>
    </div>
    </footer>

  <script src="script.js"></script>
</body>
</html>
