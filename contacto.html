<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wesstyle.arg — contacto</title>
  <link rel="icon" type="image/ico" href="img/iconos/logo.ico" />
  <link rel="stylesheet" href="style.css" />
  <link href="fonts/circular.woff2" rel="stylesheet" />
  <style>
    /* El body ya trae var(--bg) de style.css */
    
    .app-contact {
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 60px);
        background: linear-gradient(180deg, rgba(73, 59, 144, 0.05) 0%, var(--bg) 100%);
    }

    .main-contact {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .contact-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 60px 40px;
        border-radius: 24px;
        max-width: 700px;
        width: 100%;
        text-align: center;
        animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .contact-card h1 {
        font-family: 'scrib', sans-serif;
        font-size: 3.5rem;
        line-height: 1;
        margin-bottom: 40px;
        color: #fff;
        text-transform: uppercase;
    }

    .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 30px;
        margin-bottom: 50px;
    }

    .contact-item {
        transition: transform 0.3s ease;
    }

    .contact-item:hover {
        transform: translateY(-5px);
    }

    .contact-item h2 {
        font-size: 0.7rem;
        letter-spacing: 2px;
        color: var(--accent);
        margin-bottom: 10px;
        font-weight: 700;
    }

    .contact-item a {
        font-family: 'scrib', sans-serif;
        font-size: 1.8rem;
        color: #fff;
        text-decoration: none;
        transition: color 0.3s;
    }

    .contact-item a:hover {
        color: var(--accent);
    }

    .social-proof {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 30px;
        margin-top: 20px;
    }

    .social-proof p {
        font-family: 'circular', sans-serif;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.6;
        max-width: 450px;
        margin: 0 auto;
    }

    .highlight {
        color: #fff;
        font-weight: 500;
    }

    @media (max-width: 600px) {
        .contact-card { padding: 40px 20px; border: none; background: transparent; }
        .contact-card h1 { font-size: 2.5rem; }
        .contact-item a { font-size: 1.5rem; }
        .contact-grid { grid-template-columns: 1fr; gap: 40px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <img src="img/iconos/logo-texto.svg" alt="Logo" class="logo">
    </div>
    <nav class="top-nav">
      <a href="index.html" class="nav-btn outline">Diseños</a>
      <a href="precios.html" class="nav-btn outline">Precios</a>
      <button class="nav-btn active">Contacto</button>
    </nav>
  </header>

  <div class="app-contact">
    <main class="main-contact">
        <div class="contact-card">
            <h1>Hablemos de tu próximo lanzamiento</h1>
            
            <div class="contact-grid">
                <div class="contact-item">
                    <h2>INSTAGRAM</h2>
                    <a href="https://instagram.com/wesstyle.arg" target="_blank">@wesstyle.arg</a>
                </div>

                <div class="contact-item">
                    <h2>WHATSAPP</h2>
                    <a href="https://wa.me/5492983448645" target="_blank">Chat Directo</a>
                </div>
                
                <div class="contact-item">
                    <h2>EMAIL</h2>
                    <a href="mailto:wesstyle.arg@email.com">Email</a>
                </div>
            </div>

            <div class="social-proof">
                <p>
                    Más de <span class="highlight">50 artistas</span> de todo el mundo ya confían en el estudio. 
                    Tu próxima identidad visual empieza acá.
                </p>
            </div>
        </div>
    </main>
  </div>
</body>
</html>
