<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wesstyle.arg — contacto</title>
  <link rel="icon" type="image/ico" href="img/iconos/logo.ico" />
  <link rel="stylesheet" href="style.css" />
  <link href="fonts/circular.woff2" rel="stylesheet" />
  <style>
    /* Reset de scroll para esta página específica */
    body {
        overflow-y: auto !important;
        height: auto;
        min-height: 100vh;
        background: radial-gradient(circle at top right, rgba(73, 59, 144, 0.15), var(--bg));
    }

    .contact-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        width: 100%;
    }

    /* Tarjeta de contacto principal */
    .contact-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        backdrop-filter: blur(15px);
        padding: 60px 40px;
        border-radius: 24px;
        max-width: 700px;
        width: 100%;
        text-align: center;
        animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .contact-card h1 {
        font-family: 'scrib', sans-serif;
        font-size: 3.5rem;
        line-height: 1;
        margin-bottom: 40px;
        color: #fff;
        text-transform: uppercase;
    }

    /* Grid de opciones de contacto */
    .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 30px;
        margin-bottom: 50px;
    }

    .contact-item {
        padding: 20px;
        border-radius: 15px;
        transition: transform 0.3s ease, background 0.3s ease;
        border: 1px solid transparent;
    }

    .contact-item:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.03);
        border-color: var(--border);
    }

    .contact-item h2 {
        font-size: 0.7rem;
        letter-spacing: 2px;
        color: var(--accent);
        margin-bottom: 12px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .contact-item a {
        font-family: 'scrib', sans-serif;
        font-size: 1.8rem;
        color: #fff;
        text-decoration: none;
        transition: color 0.3s;
        display: block;
    }

    .contact-item a:hover {
        color: var(--accent);
    }

    /* Sección de confianza / footer de la card */
    .social-proof {
        border-top: 1px solid var(--border);
        padding-top: 30px;
        margin-top: 20px;
    }

    .social-proof p {
        font-family: 'circular', sans-serif;
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.6;
        max-width: 480px;
        margin: 0 auto;
    }

    .highlight {
        color: #fff;
        font-weight: 500;
    }

    /* Media Queries */
    @media (max-width: 600px) {
        .contact-card { 
            padding: 40px 20px; 
            background: transparent; 
            border: none; 
            backdrop-filter: none;
        }
        .contact-card h1 { font-size: 2.6rem; }
        .contact-item a { font-size: 1.5rem; }
        .contact-grid { grid-template-columns: 1fr; gap: 20px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
        <img src="img/iconos/logo-texto.svg" alt="Logo" class="logo">
    </div>
    <nav class="top-nav">
      <a href="index.html" class="nav-btn outline">Diseños</a>
      <a href="precios.html" class="nav-btn outline">Precios</a>
      <button class="nav-btn active">Contacto</button>
    </nav>
  </header>

  <main class="contact-container">
      <div class="contact-card">
          <h1>Hablemos de tu próximo lanzamiento</h1>
          
          <div class="contact-grid">
              <div class="contact-item">
                  <h2>INSTAGRAM</h2>
                  <a href="https://instagram.com/wesstyle.arg" target="_blank">@wesstyle.arg</a>
              </div>

              <div class="contact-item">
                  <h2>WHATSAPP</h2>
                  <a href="https://wa.me/5492983448645" target="_blank">Chat Directo</a>
              </div>
              
              <div class="contact-item">
                  <h2>EMAIL</h2>
                  <a href="mailto:wesstyle.arg@email.com">Enviar Mail</a>
              </div>
          </div>

          <div class="social-proof">
              <p>
                  Más de <span class="highlight">50 artistas</span> de todo el mundo ya confían en <span class="highlight">wesstyle.arg</span>. 
                  Tu próxima identidad visual empieza acá.
              </p>
          </div>
      </div>
  </main>

  <script>
    // Pequeña animación de entrada adicional para los items
    document.querySelectorAll('.contact-item').forEach((item, index) => {
        item.style.opacity = "0";
        item.style.animation = `fadeInUp 0.5s ease forwards ${0.3 + (index * 0.1)}s`;
    });
  </script>
</body>
</html>
