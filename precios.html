<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wesstyle.arg — precios</title>
  <link rel="icon" type="image/ico" href="img/iconos/logo.ico" />
  <link rel="stylesheet" href="style.css" />
  <link href="fonts/circular.woff2" rel="stylesheet" />
  <style>
    body {
        overflow-y: auto !important;
        height: auto;
        min-height: 100vh;
        background: var(--bg);
    }

    .app-prices {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding-bottom: 60px;
    }

    .prices-wrapper {
        max-width: 600px;
        margin: 60px auto;
        padding: 0 20px;
        width: 100%;
        text-align: center;
    }

    /* Contenedor del aviso de Agenda Cerrada */
    .closed-notice-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-soft);
        border-radius: 18px;
        padding: 40px 30px;
        margin-top: 30px;
        box-shadow: 0 10px 40px rgba(0,0,0,.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: fadeInNotice 0.6s cubic-bezier(.2,.8,.2,1);
    }

    .notice-badge {
        background: rgba(73, 59, 144, 0.15);
        border: 1px solid var(--accent);
        color: #cbbdff;
        font-size: 0.75rem;
        letter-spacing: .15em;
        padding: 6px 14px;
        border-radius: 999px;
        text-transform: uppercase;
        font-weight: bold;
    }

    .notice-title {
        font-family: 'scrib', sans-serif;
        font-size: 2.8rem;
        line-height: 1.1;
        margin: 10px 0 0;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .notice-desc {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        max-width: 440px;
        margin: 0 auto 10px;
    }

    /* Botón de redirección a Instagram */
    .ig-redirect-btn {
        background: var(--wesstyle);
        color: white;
        padding: 16px 32px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        font-family: 'circular', sans-serif;
        font-size: 0.9rem;
        letter-spacing: 0.05em;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 6px 20px rgba(73,59,144,.3);
        transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .ig-redirect-btn:hover {
        background: var(--accent);
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(73,59,144,.45);
    }

    @keyframes fadeInNotice {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
        .notice-title {
            font-size: 2.2rem;
        }
        .notice-desc {
            font-size: 0.85rem;
        }
        .closed-notice-card {
            padding: 30px 20px;
        }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
        <img src="img/iconos/logo-texto.svg" alt="Logo" class="logo">
    </div>
    <nav class="top-nav">
      <a href="index.html" class="nav-btn outline">Diseños</a>
      <button class="nav-btn active">Precios</button>
      <a href="contacto.html" class="nav-btn outline">Contacto</a>
      <a href="chicagoe.html" class="nav-btn outline">Chicagoe Font</a>
    </nav>
  </header>

  <div class="app-prices">
    <div class="prices-wrapper">
        <div class="section-header">
            <h3>Catálogo 2026</h3>
            <h1>Disponibilidad</h1>
        </div>

        <div class="closed-notice-card">
            <span class="notice-badge">Pausado temporalmente</span>
            <div class="notice-title">PRECIOS SEGUN PROYECTO.</div>
            <p class="notice-desc">
                Actualmente los presupuestos estándar se encuentran pausados. Si tenés un proyecto o querés consultar por curiosidad, escribime directo por las redes.
            </p>
            <a href="https://instagram.com/wesstyle.arg" target="_blank" class="ig-redirect-btn">
                <span>CONSULTAR POR INSTAGRAM</span>
                <span style="font-size: 1.1rem;">→</span>
            </a>
        </div>
    </div>
  </div>

</body>
</html>
